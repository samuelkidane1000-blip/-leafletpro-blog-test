name: Update Blog Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest AutoSEO RSS feed
        run: |
          curl -L --fail --retry 3 \
          "https://blog.leafletprouk.com/feed.xml" \
          -o feed.xml

      - name: Save updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml

          if git diff --cached --quiet; then
            echo "No RSS changes"
          else
            git commit -m "Update AutoSEO blog feed"
            git push
          fi
